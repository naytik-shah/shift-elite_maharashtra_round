# Adds host ports for Postgres and Redis (127.0.0.1 only) so test scripts can read the database.
# Never use this on the public VM.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.expose.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"
  redis:
    ports:
      - "127.0.0.1:6381:6379"
