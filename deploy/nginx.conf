worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 32k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Quiet access log: only errors, so a flash crowd does not fill the disk.
    map $status $loggable { ~^[45] 1; default 0; }
    access_log /var/log/nginx/access.log combined if=$loggable;

    upstream api {
        least_conn;
        server api1:3000 max_fails=0;
        server api2:3000 max_fails=0;
        keepalive 128;
    }

    server {
        listen 80 default_server;

        root /usr/share/nginx/html;
        index index.html;

        # Live updates: no buffering, long timeout, so events reach the browser straight away.
        location ~ ^/api/v1/drops/[^/]+/events$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite, never append: clients must not be able to choose their own address.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            # If one API container is down or restarting, try the other one (reads only; a write is never repeated).
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_read_timeout 30s;
        }

        # Hashed build files can be cached for a year; the page itself never.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
