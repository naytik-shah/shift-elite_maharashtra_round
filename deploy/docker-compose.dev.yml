# Postgres and Redis only, for running the API on your own machine:
name: fairdrop
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairdrop
      POSTGRES_PASSWORD: fairdrop
      POSTGRES_DB: fairdrop
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "log_min_duration_statement=500"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdrop"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxclients", "100000"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
