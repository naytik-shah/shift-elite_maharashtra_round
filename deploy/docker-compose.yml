# The full stack (VM 1 in the TRD): nginx, two API processes, the worker, Postgres and Redis.
#
#   cp deploy/.env.example deploy/.env      (then fill in the secrets)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only nginx is published (HTTP_PORT, default 80). To reach Postgres or Redis from the host for
# tests, add the override file:  -f deploy/docker-compose.expose.yml
name: fairdrop-stack

x-server: &server
  build: ../server
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://fairdrop:${POSTGRES_PASSWORD:-fairdrop}@postgres:5432/fairdrop
    REDIS_URL: redis://redis:6379
    DROPS_CONFIG_PATH: ${DROPS_CONFIG_PATH:-/app/config/drops.yaml}
    DISPOSABLE_DOMAINS_PATH: /app/config/disposable-domains.txt
  volumes:
    - ../config:/app/config:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    # nginx looks up the API addresses when it starts or reloads (deploy/up.sh reloads it after every update).
    depends_on:
      - api1
      - api2
    ulimits:
      nofile: { soft: 200000, hard: 200000 }

  api1:
    <<: *server
  api2:
    <<: *server

  worker:
    <<: *server
    command: ["node", "src/worker.js"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairdrop}
      POSTGRES_DB: fairdrop
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}", "-c", "max_wal_size=2GB", "-c", "wal_compression=on", "-c", "checkpoint_completion_target=0.9", "-c", "log_min_duration_statement=500"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdrop"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    # Sessions live here, so the data is written to disk (about a second behind) and survives a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxclients", "100000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
