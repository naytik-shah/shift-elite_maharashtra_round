organisers:
  - organiser@fairdrop.test

# The events people see. Seat counts follow the size of the event: a comedy night is a two digit number,
# a conference or a rooftop party three, a festival four and a stadium concert five. Demand is always far
# higher than the seats, which is the point of the draw.
drops:
  - id: launch-night
    name: Launch Night
    seats: 500
    window_opens_at: "2026-10-04T10:00:00+05:30"
    window_closes_at: "2026-10-04T18:00:00+05:30"
    draw_at: "2026-10-04T20:00:00+05:30"
    confirm_window_min: 10
    ticket_price: 500

